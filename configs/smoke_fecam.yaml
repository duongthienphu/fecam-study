experiment: smoke-test
protocol: cifar100-smoke-b5-i5-v1
seed: 1
dataset:
  name: uoft-cs/cifar100
  revision: aadb3af77e9048adbea6b47c21a81e47dd092ae5
  root: data
split:
  total_classes: 10
  initial_classes: 5
  increment: 5
  class_order_seed: 1993
backbone: resnet18-cifar-cosine
training:
  epochs: 3
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0001
loader:
  batch_size: 16
  num_workers: 0
  train_samples_per_class: 500
  test_samples_per_class: 100
classifier:
  name: fecam
  mode: full
  per_class_covariance: true
  full_covariance: true
  tukey_beta: 0.5
  shrinkage_gamma1: 1.0
  shrinkage_gamma2: 1.0
  correlation_normalization: true
